<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cron Health Dashboard</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #232323;
      --panel-2: #2a2a2a;
      --text: #e0e0e0;
      --muted: #a3a3a3;
      --accent: #56b6ff;
      --ok: #44d27a;
      --error: #ff5f5f;
      --idle: #f3d15d;
      --running: #56b6ff;
      --border: #3a3a3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
    }

    .container {
      width: min(1200px, 94vw);
      margin: 1.25rem auto 2rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.3rem, 2vw + 0.8rem, 2rem);
    }

    .sub {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 0.7rem;
      margin-bottom: 1rem;
    }

    .stat {
      padding: 0.8rem 0.9rem;
    }

    .stat .label {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
    }

    .stat .value {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .controls {
      padding: 0.9rem;
      margin-bottom: 1rem;
    }

    .controls .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      margin-bottom: 0.45rem;
    }

    .controls .hint {
      color: var(--muted);
      font-size: 0.86rem;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #121212;
      color: var(--text);
      padding: 0.7rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.82rem;
    }

    .btn {
      border: 1px solid var(--border);
      background: #2e2e2e;
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .btn:hover {
      border-color: #5a5a5a;
      background: #353535;
    }

    .btn.primary {
      background: #0f4c70;
      border-color: #17628e;
    }

    .btn.primary:hover {
      background: #125b86;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.75rem 0 1rem;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #232323;
      color: var(--text);
      padding: 0.34rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .filter-btn.active {
      border-color: #6a6a6a;
      background: #343434;
    }

    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 0.75rem;
    }

    .job {
      padding: 0.8rem;
    }

    .job-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 0.7rem;
      margin-bottom: 0.4rem;
    }

    .job-name {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      word-break: break-word;
    }

    .job-id {
      color: var(--muted);
      font-size: 0.73rem;
      margin-top: 0.2rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.48rem;
      border-radius: 999px;
      border: 1px solid;
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: 0.52rem;
      height: 0.52rem;
      border-radius: 50%;
    }

    .status-ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok), #000 50%); }
    .status-ok .dot { background: var(--ok); }

    .status-error { color: var(--error); border-color: color-mix(in srgb, var(--error), #000 50%); }
    .status-error .dot { background: var(--error); }

    .status-idle { color: var(--idle); border-color: color-mix(in srgb, var(--idle), #000 50%); }
    .status-idle .dot { background: var(--idle); }

    .status-running { color: var(--running); border-color: color-mix(in srgb, var(--running), #000 50%); }
    .status-running .dot { background: var(--running); }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem 0.8rem;
      font-size: 0.82rem;
      margin-top: 0.45rem;
    }

    .meta dt {
      color: var(--muted);
      margin-bottom: 0.14rem;
    }

    .meta dd {
      margin: 0;
      font-weight: 600;
      word-break: break-word;
    }

    .empty {
      padding: 1rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
    }

    #message {
      margin-top: 0.5rem;
      font-size: 0.84rem;
      color: var(--muted);
      min-height: 1.1em;
    }

    @media (max-width: 900px) {
      .summary {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }

    @media (max-width: 767px) {
      .jobs-grid {
        grid-template-columns: 1fr;
      }

      .container {
        width: min(100%, 96vw);
      }

      .controls .row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OpenClaw Cron Health Dashboard</h1>
    <p class="sub">Paste JSON from <code>openclaw cron list --json</code> and click “Load Data”. Sample jobs are shown by default.</p>

    <section class="summary" aria-label="Summary stats">
      <article class="card stat"><div class="label">Total jobs</div><div class="value" id="totalJobs">0</div></article>
      <article class="card stat"><div class="label">OK rate</div><div class="value" id="okRate">0%</div></article>
      <article class="card stat"><div class="label">Errors</div><div class="value" id="errorCount">0</div></article>
      <article class="card stat"><div class="label">Idle</div><div class="value" id="idleCount">0</div></article>
    </section>

    <section class="card controls" aria-label="Data input">
      <div class="row">
        <strong>JSON Input</strong>
        <button class="btn primary" id="loadBtn" type="button">Load Data</button>
      </div>
      <div class="hint">Accepted root formats: array, <code>{"jobs": [...]}</code>, <code>{"crons": [...]}</code>, <code>{"data": [...]}</code>.</div>
      <textarea id="jsonInput" placeholder='[ { "name": "sync_accounts", "schedule": "*/15 * * * *", "status": "ok", "next_run": "2026-03-23T20:00:00Z", "last_run": "2026-03-23T19:45:00Z", "model": "gpt-4.1-mini" } ]'></textarea>
      <div id="message" aria-live="polite"></div>
    </section>

    <nav class="filters" aria-label="Status filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ok">OK</button>
      <button class="filter-btn" data-filter="error">Error</button>
      <button class="filter-btn" data-filter="idle">Idle</button>
      <button class="filter-btn" data-filter="running">Running</button>
    </nav>

    <section id="jobGrid" class="jobs-grid" aria-label="Cron jobs grid"></section>
  </div>

  <script>
    const STATUS = {
      ok: 'ok',
      error: 'error',
      idle: 'idle',
      running: 'running'
    };

    let allJobs = [];
    let activeFilter = 'all';

    const els = {
      totalJobs: document.getElementById('totalJobs'),
      okRate: document.getElementById('okRate'),
      errorCount: document.getElementById('errorCount'),
      idleCount: document.getElementById('idleCount'),
      jsonInput: document.getElementById('jsonInput'),
      loadBtn: document.getElementById('loadBtn'),
      jobGrid: document.getElementById('jobGrid'),
      message: document.getElementById('message')
    };

    function first(...vals) {
      for (const v of vals) {
        if (v !== undefined && v !== null && String(v).trim() !== '') return v;
      }
      return null;
    }

    function toDate(value) {
      if (value === null || value === undefined || value === '') return null;
      if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
      if (typeof value === 'number') {
        const ms = value < 1e12 ? value * 1000 : value;
        const dt = new Date(ms);
        return Number.isNaN(dt.getTime()) ? null : dt;
      }
      const txt = String(value).trim();
      if (/^\d+$/.test(txt)) {
        const num = Number(txt);
        return toDate(num);
      }
      const dt = new Date(txt);
      return Number.isNaN(dt.getTime()) ? null : dt;
    }

    function formatRelative(date) {
      if (!date) return '—';
      const now = Date.now();
      const diff = date.getTime() - now;
      const past = diff < 0;
      const abs = Math.abs(diff);

      if (abs < 45000) return past ? 'just now' : 'in <1m';

      const units = [
        { ms: 24 * 60 * 60 * 1000, suffix: 'd' },
        { ms: 60 * 60 * 1000, suffix: 'h' },
        { ms: 60 * 1000, suffix: 'm' }
      ];

      for (const unit of units) {
        if (abs >= unit.ms) {
          const value = Math.round(abs / unit.ms);
          return past ? `${value}${unit.suffix} ago` : `in ${value}${unit.suffix}`;
        }
      }

      const secs = Math.max(1, Math.round(abs / 1000));
      return past ? `${secs}s ago` : `in ${secs}s`;
    }

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function cronToHuman(expr) {
      if (!expr || typeof expr !== 'string') return '—';
      const parts = expr.trim().split(/\s+/);
      if (parts.length < 5) return expr;

      const [min, hour, dom, mon, dow] = parts;
      const dowNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const minuteText = /^\d+$/.test(min) ? `:${pad2(Number(min))}` : ':00';

      if (min === '*' && hour === '*' && dom === '*' && mon === '*' && dow === '*') {
        return 'Every minute';
      }

      if (/^\*\/\d+$/.test(min) && hour === '*' && dom === '*' && mon === '*' && dow === '*') {
        return `Every ${min.split('/')[1]} minutes`;
      }

      if (/^\d+$/.test(min) && hour === '*' && dom === '*' && mon === '*' && dow === '*') {
        return `Every hour at ${minuteText} UTC`;
      }

      if (/^\d+$/.test(min) && /^\*\/\d+$/.test(hour) && dom === '*' && mon === '*' && dow === '*') {
        return `Every ${hour.split('/')[1]} hours at ${minuteText} UTC`;
      }

      if (/^\d+$/.test(min) && /^\d+$/.test(hour) && dom === '*' && mon === '*' && dow === '*') {
        return `Daily at ${pad2(Number(hour))}:${pad2(Number(min))} UTC`;
      }

      if (/^\d+$/.test(min) && /^\d+$/.test(hour) && dom === '*' && mon === '*' && /^\d$/.test(dow)) {
        return `Weekly on ${dowNames[Number(dow)] || `day ${dow}`} at ${pad2(Number(hour))}:${pad2(Number(min))} UTC`;
      }

      if (/^\d+$/.test(min) && /^\d+$/.test(hour) && /^\d+$/.test(dom) && mon === '*' && dow === '*') {
        return `Monthly on day ${Number(dom)} at ${pad2(Number(hour))}:${pad2(Number(min))} UTC`;
      }

      return expr;
    }

    function normalizeStatus(rawStatus) {
      const s = String(rawStatus || '').toLowerCase().trim();
      if (!s) return STATUS.idle;

      if (['ok', 'healthy', 'success', 'succeeded', 'pass', 'up'].includes(s)) return STATUS.ok;
      if (['error', 'failed', 'fail', 'fatal', 'down'].includes(s)) return STATUS.error;
      if (['running', 'in_progress', 'processing', 'active', 'working'].includes(s)) return STATUS.running;
      if (['idle', 'paused', 'waiting', 'scheduled', 'pending'].includes(s)) return STATUS.idle;

      return [STATUS.ok, STATUS.error, STATUS.idle, STATUS.running].includes(s) ? s : STATUS.idle;
    }

    function extractJobs(raw) {
      if (Array.isArray(raw)) return raw;
      if (!raw || typeof raw !== 'object') return [];

      for (const key of ['jobs', 'crons', 'items', 'data', 'results']) {
        if (Array.isArray(raw[key])) return raw[key];
      }

      if (raw.data && typeof raw.data === 'object') {
        for (const key of ['jobs', 'crons', 'items', 'results']) {
          if (Array.isArray(raw.data[key])) return raw.data[key];
        }
      }

      const entries = Object.entries(raw).filter(([, v]) => v && typeof v === 'object' && !Array.isArray(v));
      if (entries.length > 0) {
        const looksLikeJobMap = entries.every(([, v]) =>
          'schedule' in v || 'cron' in v || 'status' in v || 'last_run' in v || 'next_run' in v
        );
        if (looksLikeJobMap) {
          return entries.map(([name, val]) => ({ ...val, name: first(val.name, name) }));
        }
      }

      return [];
    }

    
    function parseSchedule(scheduleObj) {
      if (typeof scheduleObj === 'string') return scheduleObj;
      if (!scheduleObj || typeof scheduleObj !== 'object') return '—';
      
      const kind = scheduleObj.kind;
      if (kind === 'every') {
        const ms = scheduleObj.everyMs || 0;
        const mins = Math.round(ms / 60000);
        const hours = Math.round(ms / 3600000);
        const days = Math.round(ms / 86400000);
        if (days >= 1) return `every ${days}d`;
        if (hours >= 1) return `every ${hours}h`;
        return `every ${mins}m`;
      }
      if (kind === 'at') return `once at ${(scheduleObj.at || '').split('T')[0]}`;
      if (kind === 'cron') return scheduleObj.expr || '—';
      return JSON.stringify(scheduleObj);
    }


    function normalizeJob(job, index) {
      const state = job.state || {};
      const payload = job.payload || {};
      const scheduleRaw = typeof job.schedule === 'object' ? parseSchedule(job.schedule) : (job.schedule || job.cron || '—');
      const scheduleHuman = scheduleRaw.startsWith('every') || scheduleRaw.startsWith('once') ? scheduleRaw : cronToHuman(scheduleRaw);

      return {
        id: job.id || '',
        name: job.name || `cron-job-${index + 1}`,
        scheduleRaw: scheduleRaw,
        scheduleHuman: scheduleHuman,
        nextRun: toDate(state.nextRunAtMs || job.next_run || job.nextRun),
        lastRun: toDate(state.lastRunAtMs || job.last_run || job.lastRun),
        status: normalizeStatus(state.lastRunStatus || state.lastStatus || job.status || 'idle'),
        model: payload.model || job.model || '—'
      };
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function setMessage(text, error = false) {
      els.message.textContent = text || '';
      els.message.style.color = error ? '#ff8a8a' : 'var(--muted)';
    }

    function updateSummary() {
      const total = allJobs.length;
      const okCount = allJobs.filter(j => j.status === STATUS.ok).length;
      const errorCount = allJobs.filter(j => j.status === STATUS.error).length;
      const idleCount = allJobs.filter(j => j.status === STATUS.idle).length;
      const okRate = total ? Math.round((okCount / total) * 100) : 0;

      els.totalJobs.textContent = String(total);
      els.okRate.textContent = `${okRate}%`;
      els.errorCount.textContent = String(errorCount);
      els.idleCount.textContent = String(idleCount);
    }

    function renderJobs() {
      const jobs = activeFilter === 'all'
        ? allJobs
        : allJobs.filter(j => j.status === activeFilter);

      if (jobs.length === 0) {
        els.jobGrid.innerHTML = '<div class="empty">No jobs match this filter.</div>';
        return;
      }

      const html = jobs.map(job => `
        <article class="card job">
          <div class="job-top">
            <div>
              <h3 class="job-name">${escapeHtml(job.name)}</h3>
              ${job.id ? `<div class="job-id">${escapeHtml(job.id)}</div>` : ''}
            </div>
            <span class="badge status-${job.status}"><span class="dot"></span>${escapeHtml(job.status)}</span>
          </div>
          <dl class="meta">
            <div>
              <dt>Schedule</dt>
              <dd title="${escapeHtml(job.scheduleRaw)}">${escapeHtml(job.scheduleHuman)}</dd>
            </div>
            <div>
              <dt>Model</dt>
              <dd>${escapeHtml(job.model)}</dd>
            </div>
            <div>
              <dt>Next run</dt>
              <dd>${formatRelative(job.nextRun)}</dd>
            </div>
            <div>
              <dt>Last run</dt>
              <dd>${formatRelative(job.lastRun)}</dd>
            </div>
          </dl>
        </article>
      `).join('');

      els.jobGrid.innerHTML = html;
    }

    function renderAll() {
      updateSummary();
      renderJobs();
    }

    function parseJsonInput(text) {
      const trimmed = text.trim();
      if (!trimmed) return null;

      try {
        return JSON.parse(trimmed);
      } catch {
        const firstBrace = Math.min(
          ...['{', '[']
            .map(ch => trimmed.indexOf(ch))
            .filter(i => i >= 0)
        );
        const lastCurly = trimmed.lastIndexOf('}');
        const lastSquare = trimmed.lastIndexOf(']');
        const lastBrace = Math.max(lastCurly, lastSquare);

        if (Number.isFinite(firstBrace) && lastBrace > firstBrace) {
          const candidate = trimmed.slice(firstBrace, lastBrace + 1);
          return JSON.parse(candidate);
        }
        throw new Error('Could not locate valid JSON payload.');
      }
    }

    function buildSampleJobs() {
      const now = Date.now();
      const at = mins => new Date(now + mins * 60000).toISOString();

      return [
        { id: 'oc-001', name: 'sync_customer_profiles', schedule: '*/15 * * * *', status: 'ok', next_run: at(12), last_run: at(-3), model: 'gpt-4.1-mini' },
        { id: 'oc-002', name: 'billing_reconciliation', schedule: '0 */2 * * *', status: 'running', next_run: at(68), last_run: at(-52), model: 'gpt-4.1' },
        { id: 'oc-003', name: 'nightly_embedding_refresh', schedule: '30 2 * * *', status: 'ok', next_run: at(410), last_run: at(-1030), model: 'text-embedding-3-large' },
        { id: 'oc-004', name: 'dead_letter_queue_replay', schedule: '*/30 * * * *', status: 'idle', next_run: at(27), last_run: at(-131), model: 'gpt-4.1-mini' },
        { id: 'oc-005', name: 'fraud_signal_aggregation', schedule: '5 * * * *', status: 'error', next_run: at(41), last_run: at(-19), model: 'gpt-4.1' },
        { id: 'oc-006', name: 'search_index_compaction', schedule: '45 3 * * 0', status: 'idle', next_run: at(5110), last_run: at(-1530), model: 'n/a' },
        { id: 'oc-007', name: 'partner_webhook_backfill', schedule: '*/10 * * * *', status: 'running', next_run: at(8), last_run: at(-2), model: 'gpt-4.1-mini' },
        { id: 'oc-008', name: 'weekly_retention_digest', schedule: '0 9 * * 1', status: 'ok', next_run: at(8930), last_run: at(-1170), model: 'gpt-4.1' },
        { id: 'oc-009', name: 'inventory_anomaly_scan', schedule: '20 */6 * * *', status: 'error', next_run: at(152), last_run: at(-212), model: 'gpt-4.1' },
        { id: 'oc-010', name: 'regional_pricing_snapshot', schedule: '0 1 * * *', status: 'ok', next_run: at(330), last_run: at(-1110), model: 'gpt-4.1-mini' },
        { id: 'oc-011', name: 'sla_breach_predictor', schedule: '*/5 * * * *', status: 'running', next_run: at(2), last_run: at(-1), model: 'gpt-4.1-nano' },
        { id: 'oc-012', name: 'stale_session_cleanup', schedule: '0 */4 * * *', status: 'idle', next_run: at(129), last_run: at(-110), model: 'n/a' }
      ];
    }

    function loadJobsFromData(raw, source = 'input') {
      const extracted = extractJobs(raw);
      const normalized = extracted.map(normalizeJob);

      if (normalized.length === 0) {
        if (source === 'sample') {
          allJobs = buildSampleJobs().map(normalizeJob);
          setMessage('Loaded sample data (12 jobs).');
        } else {
          allJobs = [];
          setMessage('No cron jobs found in JSON payload.', true);
        }
      } else {
        allJobs = normalized;
        if (source === 'sample') {
          setMessage(`Loaded sample data (${allJobs.length} jobs).`);
        } else {
          setMessage(`Loaded ${allJobs.length} jobs from JSON.`);
        }
      }

      renderAll();
    }

    els.loadBtn.addEventListener('click', () => {
      const value = els.jsonInput.value.trim();

      if (!value) {
        loadJobsFromData(buildSampleJobs(), 'sample');
        return;
      }

      try {
        const parsed = parseJsonInput(value);
        if (!parsed) {
          loadJobsFromData(buildSampleJobs(), 'sample');
          return;
        }
        loadJobsFromData(parsed, 'input');
      } catch (err) {
        setMessage(`Invalid JSON: ${err.message}`, true);
      }
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderJobs();
      });
    });

    // Initial load with fallback sample data so UI is never empty.
    loadJobsFromData(buildSampleJobs(), 'sample');

    // Keep relative timestamps fresh.
    setInterval(renderJobs, 60 * 1000);
  </script>
</body>
</html>
